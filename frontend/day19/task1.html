<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: lightblue;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .circle {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            animation-name: move;
            animation-direction: reverse;
        
            animation-iteration-count: infinite;
            transform: translateY(100%);
            animation-timing-function: linear;

        }

        .circle:nth-child(1) {
            width: 100px;
            height: 100px;
            left: 20%;
                animation-duration: 4s;
        }

        .circle:nth-child(2) {
            width: 150px;
            height: 150px;
            left: 60%;
                animation-duration: 2s;
        }


        .circle:nth-child(3) {
            width: 80px;
            height: 80px;
            left: 80%;
                animation-duration: 6s;
        }

        .circle:nth-child(4) {
            width: 60px;
            height: 60px;
            left: 90%;
                animation-duration: 2s;
        }

        @keyframes move {
            50% {
                transform: translateY(-200px) scale(0);
            }

            90% {
                transform: translateY(-800px) scale(1);
                opacity: 0;
            }

            100%{
                transform: translateY(0) scale(0.6);
            }

        }
    </style>
</head>

<body>

    <div class="container">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

    </div>

</body>

</html>
