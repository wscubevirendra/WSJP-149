<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .circle {
            width: 200px;
            height: 200px;
            border: 4px solid red;
            margin: 70px auto;
            border-radius: 50%;
            border-left: none;
            animation: loader 4s infinite linear;

        }

        @keyframes loader {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="circle">

    </div>

</body>

</html>
