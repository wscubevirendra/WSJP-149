<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .number-container {
            width: 1060px;
            height: 568px;
            border: 2px solid red;
            margin: auto;
            padding: 16px;
            text-align: center;
        }

        .number-container h2 {
            margin-bottom: 16px;
            font-size: 32px;
        }

        .card-container {
            width: 100%;
            height: 443px;
            padding: 10px;
            display: flex;
            gap: 20px;

        }

        .col1 {
            width: 50%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            
        }

        .col2 {
            width: 50%;
            height: 100%;
            box-shadow: 0px 1px 1px black;

        }

        .card {
            border: 1px solid black;
            width: calc(50% - 10px);
            box-shadow: 0px 1px 1px black;
            height: 218px;
        }
        .card:nth-child(1){
            width: 100%;
        }
    </style>
</head>

<body>
    <section class="number-container">
        <h2>Our Impact Numbers</h2>
        <p>Join our rapidly growing learning community and acquire real-world skills.</p>
        <div class="card-container">
            <div class="col1">
                <div class="card">1</div>
                <div class="card">2</div>
                <div class="card">3</div>
            </div>
            <div class="col2">
                <img width="100%" height="100%"
                    src="https://deen3evddmddt.cloudfront.net/static/images/home-images/yt-learners-bg-top.svg" alt="">
            </div>
        </div>

    </section>

</body>

</html>
