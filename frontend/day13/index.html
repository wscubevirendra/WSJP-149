<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .cities-section {
            width: 1100px;
            padding: 16px;
            margin: 50px auto;
            border: 2px solid red;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .city-card {

            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            font-size: 18px;
            text-align: center;
            border: 1.5px solid rgba(2, 6, 12, 0.15);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>

<body>
    <section class="cities-section">
        <div class="city-card">Order food online in Bangalore</div>
        <div class="city-card">Order food online in Gurgaon</div>
        <div class="city-card">Order food online in Jaipur</div>
        <div class="city-card">Order food online in Delhi</div>
        <div class="city-card">Order food online in Pune</div>
        <div class="city-card">Order food online in Chennai</div>
        <div class="city-card">Order food online in Ahmedabad</div>
        <div class="city-card"> Order food online in Chandigarh</div>
        <div class="city-card">Order food online in Pune</div>

    </section>
</body>

</html>
